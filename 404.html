<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aditya Polisetty</title>
<meta name="description" content="The website of Aditya Polisetty is coming soon.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
  /* One centred sign on a quiet field, in the old site's Oxford Navy and Source Sans */
  :root {
    --bg: #fbfbfd;
    --fg: #172036;
    --muted: #5d6779;
    --accent: #14387f;
    --rule: #d9deea;
    --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
    --font-body: "Source Sans 3", "Source Sans Pro", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1220;
      --fg: #e7ebf3;
      --muted: #9aa4b8;
      --accent: #93b2f2;
      --rule: #24304a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    padding-block: 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 28px;
    width: 100%;
    max-width: 32rem;
  }
  .domain {
    margin: 0;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.4rem, 8vw, 3.75rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    text-wrap: balance;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--rule);
    width: 100%;
  }
  .sign {
    margin: 0;
    padding: 14px 22px;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <main>
    <p class="domain">adityapolisetty.com</p>
    <h1>Aditya Polisetty</h1>
    <p class="sign">Website coming soon</p>
  </main>
</body>
</html>
